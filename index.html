<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>heib12 - AI Music Studio</title>
  
  <!-- مكتبة Google الرسمية لتسجيل الدخول الحقيقي -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 font-sans">

  <div class="w-full max-w-5xl bg-slate-900 border border-cyan-500/30 rounded-2xl shadow-2xl overflow-hidden flex flex-col min-h-[640px]">
    
    <!-- Header -->
    <header class="px-6 py-4 bg-slate-900/90 border-b border-slate-800 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-indigo-600 to-purple-500 flex items-center justify-center shadow-lg shadow-cyan-500/20">
          <i class="fa-solid fa-compact-disc text-white text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">heib12</h1>
            <span class="text-xs px-2 py-0.5 rounded-full bg-cyan-950 border border-cyan-500/40 text-cyan-300 font-mono">Studio</span>
          </div>
          <p class="text-xs text-slate-400">توليد وتنزيل الموسيقى بالذكاء الاصطناعي</p>
        </div>
      </div>

      <!-- تسجيل دخول Google الحقيقي -->
      <div class="flex items-center gap-3">
        <!-- زر Google الرسمي -->
        <div id="google-signin-btn"></div>

        <!-- الملف الشخصي بعد تسجيل الدخول -->
        <div id="user-profile" class="hidden flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5">
          <img id="user-avatar" src="" class="w-6 h-6 rounded-full border border-cyan-500" />
          <span id="user-name" class="text-xs text-slate-200 font-medium"></span>
          <button onclick="signOutGoogle()" class="text-slate-400 hover:text-rose-400 text-xs ml-1" title="تسجيل الخروج">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 p-6">
      <div id="alert-box" class="hidden mb-4 p-3 rounded-xl text-xs flex items-center justify-between"></div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">عنوان الأغنية</label>
            <input id="track-title" type="text" value="نغم الصحراء" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:border-cyan-400 outline-none text-slate-100">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">وصف الموسيقى والآلات (Sound Prompt)</label>
            <textarea id="track-prompt" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm focus:border-cyan-400 outline-none text-slate-100">Modern oriental oud fusion, atmospheric ambient, deep warm sub bass, 110 bpm</textarea>
          </div>

          <button id="generate-btn" onclick="generateTrack()" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 via-indigo-600 to-purple-600 font-bold rounded-xl shadow-lg flex items-center justify-center gap-2 hover:opacity-95 transition-all">
            <i class="fa-solid fa-bolt"></i>
            <span>توليد وتأليف المقطوعة</span>
          </button>
        </div>

        <!-- قسم التنزيل -->
        <div class="bg-slate-950/60 p-4 rounded-xl border border-slate-800 space-y-4">
          <h3 class="text-sm font-semibold text-cyan-300 flex items-center gap-2">
            <i class="fa-solid fa-download"></i> قائمة التنزيل المباشر
          </h3>
          <div id="tracks-list" class="space-y-2">
            <!-- تظهر الأغاني هنا للتحميل المباشر -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // معرف Google OAuth المخصص لموقعك
    const GOOGLE_CLIENT_ID = "360411448313.apps.googleusercontent.com";

    let currentUser = null;
    let tracks = [
      {
        id: "1",
        title: "نغم الصحراء",
        url: "https://storage.googleapis.com/producer-app-public/clips/demo_track.mp3"
      }
    ];

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
      const data = parseJwt(response.credential);
      currentUser = {
        name: data.name,
        email: data.email,
        picture: data.picture,
        sub: data.sub
      };

      document.getElementById("google-signin-btn").classList.add("hidden");
      const userProfile = document.getElementById("user-profile");
      userProfile.classList.remove("hidden");
      document.getElementById("user-name").innerText = currentUser.name;
      document.getElementById("user-avatar").src = currentUser.picture;

      showAlert(`مرحباً ${currentUser.name}! تم تسجيل الدخول بنجاح.`, "success");
    }

    function signOutGoogle() {
      currentUser = null;
      document.getElementById("user-profile").classList.add("hidden");
      document.getElementById("google-signin-btn").classList.remove("hidden");
      showAlert("تم تسجيل الخروج.", "info");
    }

    window.onload = function () {
      if (window.google) {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleCredentialResponse
        });
        google.accounts.id.renderButton(
          document.getElementById("google-signin-btn"),
          { theme: "filled_blue", size: "medium", shape: "pill", text: "signin_with" }
        );
      }
      renderTracks();
    };

    function downloadAudio(url, title) {
      fetch(url)
        .then(res => res.blob())
        .then(blob => {
          const a = document.createElement("a");
          const objectUrl = URL.createObjectURL(blob);
          a.href = objectUrl;
          a.download = `${title || 'heib12-track'}.mp3`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(objectUrl);
        })
        .catch(() => {
          const a = document.createElement("a");
          a.href = url;
          a.download = `${title}.mp3`;
          a.target = "_blank";
          a.click();
        });
    }

    function generateTrack() {
      if (!currentUser) {
        showAlert("يرجى تسجيل الدخول بحساب Google أولاً للتوليد والتنزيل!", "error");
        return;
      }

      const btn = document.getElementById("generate-btn");
      const title = document.getElementById("track-title").value || "تراك جديد";

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري الإنتاج والتوزيع...`;

      setTimeout(() => {
        tracks.unshift({
          id: Date.now().toString(),
          title: title,
          url: "https://storage.googleapis.com/producer-app-public/clips/demo_track.mp3"
        });
        renderTracks();
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-bolt"></i> توليد وتأليف المقطوعة`;
        showAlert("تم إنشاء التراك بنجاح! يمكنك تنزيله الآن.", "success");
      }, 2000);
    }

    function renderTracks() {
      const container = document.getElementById("tracks-list");
      container.innerHTML = tracks.map(t => `
        <div class="p-2.5 bg-slate-900 border border-slate-800 rounded-lg flex items-center justify-between">
          <span class="text-xs font-bold text-slate-200 truncate">${t.title}</span>
          <button onclick="downloadAudio('${t.url}', '${t.title}')" class="px-2.5 py-1 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-md text-xs flex items-center gap-1">
            <i class="fa-solid fa-download"></i> تنزيل MP3
          </button>
        </div>
      `).join("");
    }

    function showAlert(msg, type) {
      const box = document.getElementById("alert-box");
      box.className = `mb-4 p-3 rounded-xl text-xs flex items-center justify-between ${
        type === 'success' ? 'bg-cyan-950 border border-cyan-500 text-cyan-200' : 'bg-rose-950 border border-rose-500 text-rose-200'
      }`;
      box.innerHTML = `<span>${msg}</span><button onclick="this.parentElement.classList.add('hidden')">✕</button>`;
      box.classList.remove("hidden");
    }
  </script>
</body>
</html>
