<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta name="google-site-verification" content="4qtykzOTuOP_khbTr3sipwjfU9ygGYgKquS8vuMJX3s" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>heib12 - AI Music Studio</title>
  
  <!-- Tailwind CSS والتنسيقات -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

  <div class="w-full max-w-4xl bg-slate-900 border border-cyan-500/30 rounded-2xl p-6 shadow-2xl">
    
    <!-- شريط الرأس -->
    <header class="flex flex-wrap items-center justify-between pb-6 border-b border-slate-800 gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center text-white">
          <i class="fa-solid fa-compact-disc text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">heib12</h1>
          <p class="text-xs text-slate-400">استوديو الموسيقى الذكي</p>
        </div>
      </div>

      <!-- قسم تسجيل الدخول بالبريد الإلكتروني -->
      <div>
        <!-- زر فتح نافذة التسجيل -->
        <button id="login-modal-btn" onclick="openLoginModal()" class="px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:opacity-90 font-semibold rounded-xl text-xs text-white shadow-lg flex items-center gap-2 transition-all">
          <i class="fa-solid fa-envelope"></i> تسجيل الدخول بالبريد
        </button>

        <!-- صندوق بيانات المستخدم المسجل -->
        <div id="user-box" class="hidden flex items-center gap-3 bg-slate-950 border border-slate-800 px-3.5 py-2 rounded-xl">
          <div class="w-8 h-8 rounded-full bg-cyan-500/20 border border-cyan-400 flex items-center justify-center text-cyan-400 font-bold text-xs">
            <i class="fa-solid fa-user"></i>
          </div>
          <div class="text-right">
            <p id="user-email-display" class="text-xs font-bold text-slate-200"></p>
            <p class="text-[10px] text-emerald-400 flex items-center gap-1">
              <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span> متصل
            </p>
          </div>
          <button onclick="logout()" class="text-slate-400 hover:text-red-400 text-xs mr-2" title="تسجيل الخروج">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- مساحة العمل والإنتاج -->
    <main class="mt-6 space-y-4">
      <div id="login-warning" class="p-3 bg-cyan-950/70 border border-cyan-500/50 rounded-xl text-cyan-200 text-xs">
        👋 مرحباً بك! قم بالضغط على زر <b>تسجيل الدخول بالبريد</b> أعلاه للبدء في التوليد والتنزيل.
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">اسم المقطوعة</label>
        <input id="track-name" type="text" value="نغم الصحراء" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:border-cyan-400 outline-none text-slate-100" />
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">الوصف الموسيقي (Sound Prompt)</label>
        <textarea id="track-desc" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:border-cyan-400 outline-none text-slate-100">Modern oriental oud fusion, atmospheric ambient, deep warm sub bass, 110 bpm</textarea>
      </div>

      <button id="gen-btn" onclick="startGeneration()" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 via-indigo-600 to-purple-600 hover:opacity-95 font-bold rounded-xl text-white shadow-lg flex items-center justify-center gap-2 transition-all">
        <i class="fa-solid fa-bolt"></i> توليد المقطوعة الموسيقية
      </button>

      <!-- قائمة الملفات الصوتية والتنزيل المباشر -->
      <div class="mt-6 border-t border-slate-800 pt-4">
        <h3 class="text-xs font-bold text-slate-300 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-download text-cyan-400"></i> الملفات الجاهزة للتنزيل المباشر:
        </h3>
        <div id="tracks-container" class="space-y-2">
          <!-- ستضاف المقاطع هنا عند التوليد -->
        </div>
      </div>
    </main>
  </div>

  <!-- نافذة تسجيل الدخول (Modal) -->
  <div id="auth-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl relative">
      <button onclick="closeLoginModal()" class="absolute top-4 left-4 text-slate-400 hover:text-white text-sm">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <h2 class="text-
