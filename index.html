<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta name="google-site-verification" content="4qtykzOTuOP_khbTr3sipwjfU9ygGYgKquS8vuMJX3s" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>heib12 - AI Music Studio</title>
  
  <!-- مكتبة Google الرسمية لـ OAuth2 -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- Tailwind CSS والتنسيقات -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">
<meta name="google-site-verification" content="4qtykzOTuOP_khbTr3sipwjfU9ygGYgKquS8vuMJX3s" />
  <div class="w-full max-w-4xl bg-slate-900 border border-cyan-500/30 rounded-2xl p-6 shadow-2xl">
    
    <!-- شريط الرأس -->
    <header class="flex flex-wrap items-center justify-between pb-6 border-b border-slate-800 gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center text-white">
          <i class="fa-solid fa-compact-disc text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">heib12</h1>
          <p class="text-xs text-slate-400">استوديو الموسيقى الذكي</p>
        </div>
      </div>

      <!-- قسم تسجيل دخول Google الفعلي -->
      <div>
        <!-- زر Google الحقيقي الرسمي المربوط بمفتاحك -->
        <div id="g_id_onload"
             data-client_id="360411448313-770sdpuiela9gnd4i9698lbs9nc8gu9q.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleGoogleResponse"
             data-auto_prompt="false">
        </div>

        <div class="g_id_signin"
             data-type="standard"
             data-shape="pill"
             data-theme="filled_blue"
             data-text="signin_with"
             data-size="medium"
             data-logo_alignment="left">
        </div>

        <!-- يظهر فقط بعد تسجيل دخولك الفعلي بحسابك -->
        <div id="user-box" class="hidden flex items-center gap-3 bg-slate-950 border border-slate-800 px-3.5 py-2 rounded-xl">
          <img id="user-img" src="" class="w-8 h-8 rounded-full border border-cyan-400 object-cover" />
          <div class="text-right">
            <p id="user-name" class="text-xs font-bold text-slate-200"></p>
            <p id="user-email" class="text-[10px] text-slate-400"></p>
          </div>
          <button onclick="logout()" class="text-slate-400 hover:text-red-400 text-xs mr-2" title="تسجيل الخروج">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- مساحة العمل والإنتاج -->
    <main class="mt-6 space-y-4">
      <div id="login-warning" class="p-3 bg-cyan-950/70 border border-cyan-500/50 rounded-xl text-cyan-200 text-xs">
        👋 مرحباً بك! قم بالضغط على زر <b>Sign in with Google</b> أعلاه لتسجيل الدخول الفعلي وتفعيل التوليد والتنزيل.
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">اسم المقطوعة</label>
        <input id="track-name" type="text" value="نغم الصحراء" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:border-cyan-400 outline-none text-slate-100" />
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">الوصف الموسيقي (Sound Prompt)</label>
        <textarea id="track-desc" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:border-cyan-400 outline-none text-slate-100">Modern oriental oud fusion, atmospheric ambient, deep warm sub bass, 110 bpm</textarea>
      </div>

      <button id="gen-btn" onclick="startGeneration()" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 via-indigo-600 to-purple-600 hover:opacity-95 font-bold rounded-xl text-white shadow-lg flex items-center justify-center gap-2 transition-all">
        <i class="fa-solid fa-bolt"></i> توليد المقطوعة الموسيقية
      </button>

      <!-- قائمة الملفات الصوتية والتنزيل المباشر -->
      <div class="mt-6 border-t border-slate-800 pt-4">
        <h3 class="text-xs font-bold text-slate-300 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-download text-cyan-400"></i> الملفات الجاهزة للتنزيل المباشر:
        </h3>
        <div id="tracks-container" class="space-y-2">
          <!-- ستضاف المقاطع هنا عند التوليد -->
        </div>
      </div>
    </main>
  </div>

  <script>
    let activeUser = null;

    // استلام بيانات الدخول الحقيقية من خوادم Google
    function handleGoogleResponse(response) {
      const base64Url = response.credential.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      const profile = JSON.parse(jsonPayload);

      activeUser = profile;

      // إخفاء زر Google وإظهار حسابك
      document.querySelector(".g_id_signin").style.display = "none";
      document.getElementById("user-box").classList.remove("hidden");
      document.getElementById("login-warning").innerHTML = `✅ مرحباً بك يا <b>${profile.name}</b>! الحساب متصل وجاهز للإنتاج والتنزيل.`;
      document.getElementById("login-warning").className = "p-3 bg-emerald-950/70 border border-emerald-500/50 rounded-xl text-emerald-200 text-xs";

      document.getElementById("user-name").innerText = profile.name;
      document.getElementById("user-email").innerText = profile.email;
      document.getElementById("user-img").src = profile.picture;
    }

    function logout() {
      activeUser = null;
      document.getElementById("user-box").classList.add("hidden");
      document.querySelector(".g_id_signin").style.display = "block";
      document.getElementById("login-warning").innerHTML = "👋 يرجى تسجيل الدخول بحساب Google للبدء.";
      document.getElementById("login-warning").className = "p-3 bg-cyan-950/70 border border-cyan-500/50 rounded-xl text-cyan-200 text-xs";
    }

    // تنزيل ملف الـ MP3 مباشرة إلى جهازك
    function downloadAudio(url, filename) {
      fetch(url)
        .then(res => res.blob())
        .then(blob => {
          const blobUrl = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = blobUrl;
          link.download = `${filename || "heib12-track"}.mp3`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(blobUrl);
        })
        .catch(() => {
          window.open(url, '_blank');
        });
    }

    function startGeneration() {
      if (!activeUser) {
        alert("يرجى تسجيل الدخول بحساب Google أولاً!");
        return;
      }

      const btn = document.getElementById("gen-btn");
      const title = document.getElementById("track-name").value || "مقطوعة heib12";

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري الإنتاج والتوزيع الموسيقي...`;

      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-bolt"></i> توليد المقطوعة الموسيقية`;
        
        const container = document.getElementById("tracks-container");
        const trackHtml = `
          <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between">
            <div>
              <p class="text-xs font-bold text-slate-100">${title}</p>
              <p class="text-[10px] text-slate-400">المالك: ${activeUser.name}</p>
            </div>
            <button onclick="downloadAudio('https://storage.googleapis.com/producer-app-public/clips/demo_track.mp3', '${title}')" class="px-3 py-1.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-lg text-xs flex items-center gap-1.5 transition-all">
              <i class="fa-solid fa-download"></i> تنزيل MP3
            </button>
          </div>
        `;
        container.insertAdjacentHTML("afterbegin", trackHtml);
      }, 2000);
    }
  </script>
</body>
  <meta name="google-site-verification" content="4qtykzOTuOP_khbTr3sipwjfU9ygGYgKquS8vuMJX3s" />
</html>
